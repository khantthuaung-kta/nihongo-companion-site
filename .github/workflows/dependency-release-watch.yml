name: Nihongo dependency release watch

on:
  schedule:
    # 09:23 Yangon time (02:53 UTC).
    - cron: '53 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nihongo-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published dependency releases
        run: python scripts/watch_dependencies.py
      - name: Commit only actual release changes
        shell: bash
        run: |
          git add data/upstream-dependencies.json docs/dependency-release-watch.md
          if git diff --cached --quiet; then
            echo "No meaningful updates; no commit."
            exit 0
          fi
          git config user.name "khantthuaung-kta"
          git config user.email "209433505+khantthuaung-kta@users.noreply.github.com"
          git commit -m "docs: refresh upstream dependency release watch"
          git push origin HEAD:main
